name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release

jobs:
  tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: anti-drift guards
        run: bash ci/check.sh tooling

  build:
    # ubuntu-26.04 = gcc 15.2: C++26 (флаг -std=c++26 есть с gcc 14, на 24.04/gcc13
    # проект не собирался бы) + max версия, которую знает Conan (15.2) — бандл
    # можно пересобирать под тем же компилятором, что и CI.
    runs-on: ubuntu-26.04
    needs: [tooling]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build \
            g++ \
            liburing-dev \
            libtbb-dev \
            libgl1-mesa-dev libx11-dev libxkbcommon-dev \
            libwayland-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libx11-xcb-dev libfontenc-dev libice-dev libsm-dev libxaw7-dev \
            libxcomposite-dev libxdamage-dev libxext-dev libxfixes-dev libxi-dev \
            libxkbfile-dev libxmu-dev libxmuu-dev libxpm-dev libxrandr-dev \
            libxrender-dev libxres-dev libxss-dev libxt-dev libxtst-dev libxv-dev \
            libxxf86vm-dev libxcb-glx0-dev libxcb-render0-dev libxcb-render-util0-dev \
            libxcb-xkb-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-dri3-dev uuid-dev libxcb-cursor-dev \
            libxcb-dri2-0-dev libxcb-present-dev libxcb-composite0-dev \
            libxcb-ewmh-dev libxcb-res0-dev libxcb-util-dev

      # Deps (asio/flatbuffers/glm/EnTT/imgui/bgfx/...) — из бандла в GitHub
      # Release, как у конечного потребителя. Conan на CI не нужен.
      - name: Fetch offline deps bundle
        run: bash scripts/fetch-offline-deps.sh

      - name: Install bgfx/bx/bimg to /usr/local
        run: sudo bash cmake-build-offline/install-deps.sh

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DGTNH_NET_TESTS=ON \
            -GNinja

      # Body = thin wrapper over the in-repo gate. Same commands as a developer
      # running `sh ci/check.sh cpp` locally — no logic duplicated in YAML.
      - name: Gate (cpp) — build + tests
        run: bash ci/check.sh cpp
