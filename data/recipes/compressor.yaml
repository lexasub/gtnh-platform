# GTNH Platform — compressor recipes
# All recipes are STEAM-only (steam_compressor, block 52)
class: compressor
recipes:

  - name: gtnh:compress_bronze
    energy_in: STEAM
    inputs:
      - { item: bronze_ingot, count: 1 }
    outputs:
      - { item: bronze_plate, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767
    eu: 32
    resource_requirements:
      - { kind: FLUID, resource_id: steam, amount: 32, tier: 0 }

