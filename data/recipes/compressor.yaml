# GTNH Platform — compressor recipes
# All recipes are STEAM-only (steam_compressor, block 52)
class: compressor
recipes:

  - name: gtnh:compress_bronze
  - name: gtnh:compress_bronze_ele
    energy_in: ELECTRICITY
    inputs:
      - { item: bronze_ingot, count: 1 }
    outputs:
      - { item: bronze_plate, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767
    eu: 32
    resource_requirements:
      - { kind: EU, amount: 32, tier: 0 }

