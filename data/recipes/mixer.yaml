# GTNH Platform — mixer recipes
# All recipes are STEAM-only (steam_mixer, block 60)
class: mixer
recipes:

  - name: gtnh:mix_bronze_dust
    energy_in: STEAM
    inputs:
      - { item: copper_dust, count: 3 }
      - { item: tin_dust, count: 1 }
    outputs:
      - { item: bronze_dust, count: 4 }
    duration: 160
    min_tier: 0
    max_tier: 32767
    eu: 32
    resource_requirements:
      - { kind: FLUID, resource_id: steam, amount: 32, tier: 0 }

  - name: gtnh:mix_brass_dust
    energy_in: STEAM
    inputs:
      - { item: copper_dust, count: 3 }
      - { item: zinc_dust, count: 1 }
    outputs:
      - { item: brass_dust, count: 4 }
    duration: 160
    min_tier: 0
    max_tier: 32767
    eu: 32
    resource_requirements:
      - { kind: FLUID, resource_id: steam, amount: 32, tier: 0 }

  - name: gtnh:mix_electrum_dust
    energy_in: STEAM
    inputs:
      - { item: gold_dust, count: 1 }
      - { item: silver_dust, count: 1 }
    outputs:
      - { item: electrum_dust, count: 2 }
    duration: 160
    min_tier: 0
    max_tier: 32767
    eu: 32
    resource_requirements:
      - { kind: FLUID, resource_id: steam, amount: 32, tier: 0 }

  - name: gtnh:mix_steel_dust
    energy_in: STEAM
    inputs:
      - { item: iron_dust, count: 1 }
      - { item: carbon_dust, count: 1 }
    outputs:
      - { item: steel_dust, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767
    eu: 32
    resource_requirements:
      - { kind: FLUID, resource_id: steam, amount: 32, tier: 0 }
