# GTNH Platform — Crafting Table recipes
# Manual (no energy) — player 3x3 workbench recipes.
# Each recipe has a positional `pattern` (3 rows of 3 cells) that matches the
# client's 3x3 preview. Empty cell = `~`. `inputs` is kept as aggregate
# metadata (total counts per item) for recipe display / backward compat.
class: crafting_table
recipes:

  - name: crafting_table
    pattern:
      - [oak_planks, oak_planks, ~]
      - [oak_planks, oak_planks, ~]
      - [~, ~, ~]
    inputs:
      - { item: oak_planks, count: 4 }
    outputs:
      - { item: crafting_table, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: crafting_table_cobblestone
    pattern:
      - [cobblestone, cobblestone, ~]
      - [cobblestone, cobblestone, ~]
      - [~, ~, ~]
    inputs:
      - { item: cobblestone, count: 4 }
    outputs:
      - { item: crafting_table, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: crafting_table_iron
    pattern:
      - [iron_ingot, iron_ingot, ~]
      - [iron_ingot, iron_ingot, ~]
      - [~, ~, ~]
    inputs:
      - { item: iron_ingot, count: 4 }
    outputs:
      - { item: crafting_table, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: stick
    pattern:
      - [oak_planks, ~, ~]
      - [oak_planks, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: oak_planks, count: 2 }
    outputs:
      - { item: stick, count: 4 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: wooden_pickaxe
    pattern:
      - [oak_planks, oak_planks, oak_planks]
      - [~, stick, ~]
      - [~, stick, ~]
    inputs:
      - { item: oak_planks, count: 3 }
      - { item: stick, count: 2 }
    outputs:
      - { item: wooden_pickaxe, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: stone_pickaxe
    pattern:
      - [cobblestone, cobblestone, cobblestone]
      - [~, stick, ~]
      - [~, stick, ~]
    inputs:
      - { item: cobblestone, count: 3 }
      - { item: stick, count: 2 }
    outputs:
      - { item: stone_pickaxe, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: iron_pickaxe
    pattern:
      - [iron_ingot, iron_ingot, iron_ingot]
      - [~, stick, ~]
      - [~, stick, ~]
    inputs:
      - { item: iron_ingot, count: 3 }
      - { item: stick, count: 2 }
    outputs:
      - { item: iron_pickaxe, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: furnace
    pattern:
      - [cobblestone, cobblestone, cobblestone]
      - [cobblestone, ~, cobblestone]
      - [cobblestone, cobblestone, cobblestone]
    inputs:
      - { item: cobblestone, count: 8 }
    outputs:
      - { item: heat_furnace, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: chest
    pattern:
      - [oak_planks, oak_planks, oak_planks]
      - [oak_planks, ~, oak_planks]
      - [oak_planks, oak_planks, oak_planks]
    inputs:
      - { item: oak_planks, count: 8 }
    outputs:
      - { item: chest, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: torch
    pattern:
      - [coal, ~, ~]
      - [stick, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: coal, count: 1 }
      - { item: stick, count: 1 }
    outputs:
      - { item: torch, count: 4 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: wooden_axe
    pattern:
      - [oak_planks, oak_planks, ~]
      - [oak_planks, stick, ~]
      - [~, stick, ~]
    inputs:
      - { item: oak_planks, count: 3 }
      - { item: stick, count: 2 }
    outputs:
      - { item: workbench_axe, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: wooden_shovel
    pattern:
      - [oak_planks, ~, ~]
      - [stick, ~, ~]
      - [stick, ~, ~]
    inputs:
      - { item: oak_planks, count: 1 }
      - { item: stick, count: 2 }
    outputs:
      - { item: workbench_shovel, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: wooden_sword
    pattern:
