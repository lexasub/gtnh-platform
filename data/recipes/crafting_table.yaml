# GTNH Platform — Crafting Table recipes
# Manual (no energy) — player 3x3 workbench recipes.
# Each recipe has a positional `pattern` (3 rows of 3 cells) that matches the
# client's 3x3 preview. Empty cell = `~`. `inputs` is kept as aggregate
# metadata (total counts per item) for recipe display / backward compat.
class: crafting_table
recipes:

  - name: crafting_table
    pattern:
      - [oak_planks, oak_planks, ~]
      - [oak_planks, oak_planks, ~]
      - [~, ~, ~]
    inputs:
      - { item: oak_planks, count: 4 }
    outputs:
      - { item: crafting_table, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: crafting_table_cobblestone
    pattern:
      - [cobblestone, cobblestone, ~]
      - [cobblestone, cobblestone, ~]
      - [~, ~, ~]
    inputs:
      - { item: cobblestone, count: 4 }
    outputs:
      - { item: crafting_table, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: crafting_table_iron
    pattern:
      - [iron_ingot, iron_ingot, ~]
      - [iron_ingot, iron_ingot, ~]
      - [~, ~, ~]
    inputs:
      - { item: iron_ingot, count: 4 }
    outputs:
      - { item: crafting_table, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: stick
    pattern:
      - [oak_planks, ~, ~]
      - [oak_planks, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: oak_planks, count: 2 }
    outputs:
      - { item: stick, count: 4 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: wooden_pickaxe
    pattern:
      - [oak_planks, oak_planks, oak_planks]
      - [~, stick, ~]
      - [~, stick, ~]
    inputs:
      - { item: oak_planks, count: 3 }
      - { item: stick, count: 2 }
    outputs:
      - { item: wooden_pickaxe, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: stone_pickaxe
    pattern:
      - [cobblestone, cobblestone, cobblestone]
      - [~, stick, ~]
      - [~, stick, ~]
    inputs:
      - { item: cobblestone, count: 3 }
      - { item: stick, count: 2 }
    outputs:
      - { item: stone_pickaxe, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: iron_pickaxe
    pattern:
      - [iron_ingot, iron_ingot, iron_ingot]
      - [~, stick, ~]
      - [~, stick, ~]
    inputs:
      - { item: iron_ingot, count: 3 }
      - { item: stick, count: 2 }
    outputs:
      - { item: iron_pickaxe, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: furnace
    pattern:
      - [cobblestone, cobblestone, cobblestone]
      - [cobblestone, ~, cobblestone]
      - [cobblestone, cobblestone, cobblestone]
    inputs:
      - { item: cobblestone, count: 8 }
    outputs:
      - { item: heat_furnace, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: chest
    pattern:
      - [oak_planks, oak_planks, oak_planks]
      - [oak_planks, ~, oak_planks]
      - [oak_planks, oak_planks, oak_planks]
    inputs:
      - { item: oak_planks, count: 8 }
    outputs:
      - { item: chest, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  # ── BASE containers (buckets) ─────────────────────────────
  # Filled buckets: empty_bucket + fluid item → filled bucket.
  # Fluids are regular items (1111:11:xx); hydrogen and coolant are
  # registered in fluids.csv alongside the machine-usable fluids.

  - name: empty_bucket
    pattern:
      - [iron_ingot, ~, ~]
      - [iron_ingot, ~, ~]
      - [~, iron_ingot, ~]
    inputs:
      - { item: iron_ingot, count: 3 }
    outputs:
      - { item: empty_bucket, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: water_bucket
    pattern:
      - [empty_bucket, ~, ~]
      - [water, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: empty_bucket, count: 1 }
      - { item: water, count: 1 }
    outputs:
      - { item: water_bucket, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: hydrogen_bucket
    pattern:
      - [empty_bucket, ~, ~]
      - [hydrogen, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: empty_bucket, count: 1 }
      - { item: hydrogen, count: 1 }
    outputs:
      - { item: hydrogen_bucket, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: sulfuric_acid_bucket
    pattern:
      - [empty_bucket, ~, ~]
      - [sulfuric_acid, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: empty_bucket, count: 1 }
      - { item: sulfuric_acid, count: 1 }
    outputs:
      - { item: sulfuric_acid_bucket, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: coolant_bucket
    pattern:
      - [empty_bucket, ~, ~]
      - [coolant, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: empty_bucket, count: 1 }
      - { item: coolant, count: 1 }
    outputs:
      - { item: coolant_bucket, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: torch
    pattern:
      - [coal, ~, ~]
      - [stick, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: coal, count: 1 }
      - { item: stick, count: 1 }
    outputs:
      - { item: torch, count: 4 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: wooden_axe
    pattern:
      - [oak_planks, oak_planks, ~]
      - [oak_planks, stick, ~]
      - [~, stick, ~]
    inputs:
      - { item: oak_planks, count: 3 }
      - { item: stick, count: 2 }
    outputs:
      - { item: wooden_axe, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: wooden_shovel
    pattern:
      - [oak_planks, ~, ~]
      - [stick, ~, ~]
      - [stick, ~, ~]
    inputs:
      - { item: oak_planks, count: 1 }
      - { item: stick, count: 2 }
    outputs:
      - { item: wooden_shovel, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: wooden_sword
    pattern:
      - [~, oak_planks, ~]
      - [~, stick, ~]
      - [~, stick, ~]
    inputs:
      - { item: oak_planks, count: 1 }
      - { item: stick, count: 2 }
    outputs:
      - { item: wooden_sword, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: oak_log_to_planks
    pattern:
      - [oak_log, ~, ~]
      - [~, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: oak_log, count: 1 }
    outputs:
      - { item: oak_planks, count: 4 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: heat_generator
    pattern:
      - [cobblestone, cobblestone, cobblestone]
      - [cobblestone, heat_furnace, cobblestone]
      - [cobblestone, cobblestone, cobblestone]
    inputs:
      - { item: cobblestone, count: 8 }
      - { item: heat_furnace, count: 1 }
    outputs:
      - { item: heat_generator, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767


  # ── Dusts ─────────────────────────────────────────────────

  - name: bronze_dust
    pattern:
      - [copper_dust, copper_dust, ~]
      - [copper_dust, tin_dust, ~]
      - [~, ~, ~]
    inputs:
      - { item: copper_dust, count: 3 }
      - { item: tin_dust, count: 1 }
    outputs:
      - { item: bronze_dust, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  # ── Plate ─────────────────────────────────────────────────

  - name: bronze_plate
    pattern:
      - [bronze_ingot, ~, ~]
      - [bronze_ingot, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: bronze_ingot, count: 2 }
    outputs:
      - { item: bronze_plate, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  # ── Macerators ────────────────────────────────────────────
  - name: heat_macerator
    pattern:
      - [cobblestone, cobblestone, cobblestone]
      - [cobblestone, heat_furnace, cobblestone]
      - [cobblestone, crafting_table, cobblestone]
    inputs:
      - { item: cobblestone, count: 7 }
      - { item: heat_furnace, count: 1 }
      - { item: crafting_table, count: 1 }
    outputs:
      - { item: heat_macerator, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: steam_macerator
    pattern:
      - [bronze_plate, bronze_plate, bronze_plate]
      - [cable_copper, heat_macerator, cable_copper]
      - [bronze_plate, bronze_plate, bronze_plate]
    inputs:
      - { item: bronze_plate, count: 6 }
      - { item: cable_copper, count: 2 }
      - { item: heat_macerator, count: 1 }
    outputs:
      - { item: steam_macerator, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767

  - name: rotare_macerator
    pattern:
      - [stick, cobblestone, stick]
      - [cobblestone, crafting_table, cobblestone]
      - [cobblestone, stone, cobblestone]
    inputs:
      - { item: stick, count: 2 }
      - { item: cobblestone, count: 4 }
      - { item: crafting_table, count: 1 }
      - { item: stone, count: 1 }
    outputs:
      - { item: rotare_macerator, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: rotare_generator
    pattern:
      - [stick, cobblestone, stick]
      - [cobblestone, crafting_table, cobblestone]
      - [cobblestone, stone, cobblestone]
    inputs:
      - { item: cobblestone, count: 5 }
      - { item: crafting_table, count: 1 }
      - { item: stick, count: 2 }
    outputs:
      - { item: rotare_generator, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  # ── Steam machines ───────────────────────────────────────
  # Bronze-tier upgrades built around a heat_furnace core.
  # (No heat_* variants exist for these classes — heat_furnace is the hull.)

  - name: steam_compressor
    pattern:
      - [bronze_plate, bronze_plate, bronze_plate]
      - [cable_copper, heat_furnace, cable_copper]
      - [bronze_plate, bronze_plate, bronze_plate]
    inputs:
      - { item: bronze_plate, count: 6 }
      - { item: cable_copper, count: 2 }
      - { item: heat_furnace, count: 1 }
    outputs:
      - { item: steam_compressor, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767

  - name: steam_extractor
    pattern:
      - [bronze_plate, glass, bronze_plate]
      - [cable_copper, heat_furnace, cable_copper]
      - [bronze_plate, glass, bronze_plate]
    inputs:
      - { item: bronze_plate, count: 4 }
      - { item: glass, count: 2 }
      - { item: cable_copper, count: 2 }
      - { item: heat_furnace, count: 1 }
    outputs:
      - { item: steam_extractor, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767

  - name: steam_mixer
    pattern:
      - [glass, bronze_plate, glass]
      - [cable_copper, heat_furnace, cable_copper]
      - [glass, bronze_plate, glass]
    inputs:
      - { item: glass, count: 4 }
      - { item: bronze_plate, count: 2 }
      - { item: cable_copper, count: 2 }
      - { item: heat_furnace, count: 1 }
    outputs:
      - { item: steam_mixer, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767

  - name: bronze_alloy_smelter
    pattern:
      - [bronze_ingot, bronze_plate, bronze_ingot]
      - [cable_copper, heat_furnace, cable_copper]
      - [bronze_ingot, bronze_plate, bronze_ingot]
    inputs:
      - { item: bronze_ingot, count: 4 }
      - { item: bronze_plate, count: 2 }
      - { item: cable_copper, count: 2 }
      - { item: heat_furnace, count: 1 }
    outputs:
      - { item: bronze_alloy_smelter, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767

  # ── Boilers ──────────────────────────────────────────────

  - name: fluid_tank
    pattern:
      - [bronze_plate, glass, bronze_plate]
      - [glass, ~, glass]
      - [bronze_plate, glass, bronze_plate]
    inputs:
      - { item: bronze_plate, count: 4 }
      - { item: glass, count: 4 }
    outputs:
      - { item: fluid_tank, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767

  - name: steam_solid_boiler
    pattern:
      - [bronze_plate, bronze_plate, bronze_plate]
      - [heat_generator, heat_furnace, heat_generator]
      - [bronze_plate, bronze_plate, bronze_plate]
    inputs:
      - { item: bronze_plate, count: 6 }
      - { item: heat_generator, count: 2 }
      - { item: heat_furnace, count: 1 }
    outputs:
      - { item: steam_solid_boiler, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767

  - name: steam_heat_boiler
    pattern:
      - [bronze_plate, bronze_plate, bronze_plate]
      - [heat_generator, fluid_tank, heat_generator]
      - [bronze_plate, bronze_plate, bronze_plate]
    inputs:
      - { item: bronze_plate, count: 6 }
      - { item: heat_generator, count: 2 }
      - { item: fluid_tank, count: 1 }
    outputs:
      - { item: steam_heat_boiler, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767

  # ── Pipes ─────────────────────────────────────────────────
  # GT-style: normal pipe = 6 ingots (top/bottom rows), dense pipe = 8 ingots
  # (ring with hollow center). Material is a placeholder — registry has a
  # single generic pipe item per type, no per-material variants yet.

  - name: fluid_pipe
    pattern:
      - [copper_ingot, copper_ingot, copper_ingot]
      - [~, ~, ~]
      - [copper_ingot, copper_ingot, copper_ingot]
    inputs:
      - { item: copper_ingot, count: 6 }
    outputs:
      - { item: fluid_pipe, count: 2 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: item_pipe
    pattern:
      - [tin_ingot, tin_ingot, tin_ingot]
      - [~, ~, ~]
      - [tin_ingot, tin_ingot, tin_ingot]
    inputs:
      - { item: tin_ingot, count: 6 }
    outputs:
      - { item: item_pipe, count: 2 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: dense_fluid_pipe
    pattern:
      - [bronze_ingot, bronze_ingot, bronze_ingot]
      - [bronze_ingot, ~, bronze_ingot]
      - [bronze_ingot, bronze_ingot, bronze_ingot]
    inputs:
      - { item: bronze_ingot, count: 8 }
    outputs:
      - { item: dense_fluid_pipe, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: dense_item_pipe
    pattern:
      - [iron_ingot, iron_ingot, iron_ingot]
      - [iron_ingot, ~, iron_ingot]
      - [iron_ingot, iron_ingot, iron_ingot]
    inputs:
      - { item: iron_ingot, count: 8 }
    outputs:
      - { item: dense_item_pipe, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: heat_pipe
    pattern:
      - [electrum_ingot, electrum_ingot, electrum_ingot]
      - [~, ~, ~]
      - [electrum_ingot, electrum_ingot, electrum_ingot]
    inputs:
      - { item: electrum_ingot, count: 6 }
    outputs:
      - { item: heat_pipe, count: 2 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  # ── Cables ────────────────────────────────────────────────
  # Bare cable recipes use three ingots in a row. The advanced cable
  # ingredients are temporary stand-ins until their dedicated materials are
  # registered: electrum → aluminium, uranium → tungsten, bronze → platinum.

  - name: cable_tin
    pattern:
      - [tin_ingot, tin_ingot, tin_ingot]
      - [~, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: tin_ingot, count: 3 }
    outputs:
      - { item: cable_tin, count: 3 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: cable_copper
    pattern:
      - [copper_ingot, copper_ingot, copper_ingot]
      - [~, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: copper_ingot, count: 3 }
    outputs:
      - { item: cable_copper, count: 3 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: cable_gold
    pattern:
      - [gold_ingot, gold_ingot, gold_ingot]
      - [~, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: gold_ingot, count: 3 }
    outputs:
      - { item: cable_gold, count: 3 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: cable_aluminium
    pattern:
      - [electrum_ingot, electrum_ingot, electrum_ingot]
      - [~, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: electrum_ingot, count: 3 }
    outputs:
      - { item: cable_aluminium, count: 3 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: cable_tungsten
    pattern:
      - [uranium_ingot, uranium_ingot, uranium_ingot]
      - [~, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: uranium_ingot, count: 3 }
    outputs:
      - { item: cable_tungsten, count: 3 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: cable_platinum
    pattern:
      - [bronze_ingot, bronze_ingot, bronze_ingot]
      - [~, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: bronze_ingot, count: 3 }
    outputs:
      - { item: cable_platinum, count: 3 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  # ── Battery buffers ───────────────────────────────────────
  # Tier escalation: LV (tin) → MV (copper) → HV (gold).
  # Each higher tier wraps the previous buffer in cable + ingots.

  - name: battery_buffer_lv
    pattern:
      - [iron_ingot, cable_tin, iron_ingot]
      - [cable_tin, chest, cable_tin]
      - [iron_ingot, redstone, iron_ingot]
    inputs:
      - { item: iron_ingot, count: 4 }
      - { item: cable_tin, count: 4 }
      - { item: chest, count: 1 }
      - { item: redstone, count: 1 }
    outputs:
      - { item: battery_buffer_lv, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767

  - name: battery_buffer_mv
    pattern:
      - [bronze_plate, cable_copper, bronze_plate]
      - [cable_copper, battery_buffer_lv, cable_copper]
      - [bronze_plate, redstone, bronze_plate]
    inputs:
      - { item: bronze_plate, count: 4 }
      - { item: cable_copper, count: 4 }
      - { item: battery_buffer_lv, count: 1 }
      - { item: redstone, count: 1 }
    outputs:
      - { item: battery_buffer_mv, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767

  - name: battery_buffer_hv
    pattern:
      - [gold_ingot, cable_gold, gold_ingot]
      - [cable_gold, battery_buffer_mv, cable_gold]
      - [gold_ingot, redstone, gold_ingot]
    inputs:
      - { item: gold_ingot, count: 4 }
      - { item: cable_gold, count: 4 }
      - { item: battery_buffer_mv, count: 1 }
      - { item: redstone, count: 1 }
    outputs:
      - { item: battery_buffer_hv, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767

  # ── Charger ───────────────────────────────────────────────
  # Recharges tools (drills, chainsaws) — LV buffer + copper wiring.

  - name: charger
    pattern:
      - [~, cable_copper, ~]
      - [cable_copper, battery_buffer_lv, cable_copper]
      - [~, redstone, ~]
    inputs:
      - { item: cable_copper, count: 3 }
      - { item: battery_buffer_lv, count: 1 }
      - { item: redstone, count: 1 }
    outputs:
      - { item: charger, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767

  # ── Transformers ──────────────────────────────────────────
  # MV↔HV: copper input side, gold output side, iron core.
  # HV↔EV: gold input side, aluminium output side, redstone core.

  - name: transformer_mv_hv
    pattern:
      - [iron_ingot, cable_gold, iron_ingot]
      - [cable_gold, redstone, cable_copper]
      - [iron_ingot, cable_copper, iron_ingot]
    inputs:
      - { item: iron_ingot, count: 4 }
      - { item: cable_gold, count: 3 }
      - { item: cable_copper, count: 2 }
      - { item: redstone, count: 1 }
    outputs:
      - { item: transformer_mv_hv, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767

  - name: transformer_hv_ev
    pattern:
      - [gold_ingot, cable_aluminium, gold_ingot]
      - [cable_aluminium, redstone, cable_gold]
      - [gold_ingot, cable_gold, gold_ingot]
    inputs:
      - { item: gold_ingot, count: 4 }
      - { item: cable_aluminium, count: 3 }
      - { item: cable_gold, count: 2 }
      - { item: redstone, count: 1 }
    outputs:
      - { item: transformer_hv_ev, count: 1 }
    duration: 200
    min_tier: 0
    max_tier: 32767
  # ── Keys ─────────────────────────────────────────────────
  # GTNH-style lock keys: bow of ingots over a stick shaft.

  - name: hammer
    pattern:
      - [iron_ingot, iron_ingot, iron_ingot]
      - [iron_ingot, stick, iron_ingot]
      - [~, stick, ~]
    inputs:
      - { item: iron_ingot, count: 5 }
      - { item: stick, count: 1 }
    outputs:
      - { item: hammer, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: file
    pattern:
      - [~, iron_ingot, ~]
      - [~, iron_ingot, ~]
      - [~, stick, ~]
    inputs:
      - { item: iron_ingot, count: 2 }
      - { item: stick, count: 1 }
    outputs:
      - { item: file, count: 1 }
    duration: 100
    min_tier: 0
    max_tier: 32767

  - name: saw
    pattern:
      - [iron_ingot, iron_ingot, ~]
      - [stick, iron_ingot, ~]
      - [~, stick, ~]
    inputs:
      - { item: iron_ingot, count: 3 }
      - { item: stick, count: 2 }
    outputs:
      - { item: saw, count: 1 }
    duration: 100
    min_tier: 0
