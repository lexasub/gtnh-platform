# GTNH Platform — Hot Blast Furnace recipes
# HBF consumes HU/heat from its coil heating domain.
class: hbf
recipes:

  - name: gtnh:hbf_iron_smelting
    inputs:
      - { item: iron_dust, count: 1 }
    outputs:
      - { item: iron_ingot, count: 2 }
    duration: 400
    eu: 2.0
    energy_in: HEAT
    min_tier: 0
    max_tier: 32767

  - name: gtnh:hbf_gold_smelting
    inputs:
      - { item: gold_dust, count: 1 }
    outputs:
      - { item: gold_ingot, count: 2 }
    duration: 400
    eu: 2.0
    energy_in: HEAT
    min_tier: 0
    max_tier: 32767

  - name: gtnh:hbf_steel
    inputs:
      - { item: iron_ingot, count: 1 }
      - { item: coal, count: 1 }
    outputs:
      - { item: steel_ingot, count: 1 }
    duration: 400
    eu: 2.0
    energy_in: HEAT
    min_tier: 0
    max_tier: 32767
