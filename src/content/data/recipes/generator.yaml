# GTNH Platform — Generator recipes
#
# heat_generator: burns fuel → produces HEAT
#   energy in: none (burns fuel items directly)
#   energy out: HEAT (energy_output)
#
# The creative blocks are infinite sources handled directly by their systems
# (CreativeGeneratorSystem for energy, CreativeFluidSystem for oil/water) -
# they need no RECIPE to run. But a quest that wants one has to be able to
# obtain it, so all three creative blocks DO have a cheap craft recipe here:
# creative_generator_block, creative_oil_generator_block,
# creative_water_generator_block (see the class: crafting_table note below).
#
# The two creative FLUID blocks below (creative_oil_generator,
# creative_water_generator) are the exception, and they need their own
# explanation. They are listed here because they are generator-class blocks,
# but they are NOT crafted in a generator:
#
#   RecipeManager.cpp:812-844 — for machine_class "generator" or "boiler" the
#   loader SKIPS the outputs block entirely. A recipe in this file that named
#   an item under `outputs:` would parse as a valid recipe and would produce
#   NOTHING at runtime, because recipe.outputs is left empty. A `class:
#   generator` recipe can therefore never yield an item, ever.
#
#   So the two creative fluid blocks carry an explicit per-recipe
#   `class: crafting_table` override (RecipeManager.cpp:688-691). That puts
#   them in a real item-producing class, where `outputs` is parsed and the
#   block is genuinely craftable. The recipe below is the real thing: the
#   block is obtainable as an ITEM.
#
#   What is NOT solved here, and cannot be: the fluid itself. The creative
#   fluid blocks fill the pipe network with a fluid VOLUME (FluidClient /
#   FluidStorage, network-volume based). There is no fluid -> bucket-item
#   conversion anywhere in the game — recipes consume the ITEM
#   `oil_bucket` (0:11111:18), and nothing produces that item. So
#   creative_oil_generator makes oil available to the NETWORK, not to an
#   inventory bucket. oil_bucket stays unreachable until a C++/machine-side
#   bucket-fill path exists. Do not "fix" that with a free recipe here; that
#   would be a design lie.
class: generator
recipes:

  # ── Solid fuel → HEAT ───────────────────────────────────
  - name: generator_coal
    inputs:
      - { item: coal, count: 1 }   # coal
    duration: 100
    energy_output: 4000   # HU generated

  - name: generator_oak_planks
    inputs:
      - { item: oak_planks, count: 1 }   # oak_planks
    duration: 50
    energy_output: 1000   # HU generated

  - name: generator_charcoal
    inputs:
      - { item: charcoal, count: 1 }
    duration: 100
    energy_output: 8000   # HU generated

  - name: generator_oak_log
    inputs:
      - { item: oak_log, count: 1 }
    duration: 50
    energy_output: 2000   # HU generated

  # ── Creative fluid blocks → obtainable as items ──────────
  #
  # `class: crafting_table` is a PER-RECIPE override of the file-level
  # `class: generator` (RecipeManager.cpp:688-691). It is mandatory, not
  # cosmetic: generator-class recipes have their `outputs` skipped by the
  # loader (RecipeManager.cpp:812), so under the file default these two would
  # load clean and craft nothing.
  #
  # Cost is deliberately trivial and needs no real resources: creative.
  # oak_planks is the cheapest universally-available item at game start (a
  # world-tree drop), and Recipe::matches counts required inputs
  # (RecipeManager.cpp:146), so a recipe needs a real one.
  # creative_generator itself, for the same reason. It was the one creative
  # block WITHOUT a recipe, which is why quest 37 ("ULV Transition") stayed
  # unpassable even after its requirement was corrected to `place`: a quest can
  # complete on a block being placed, but the player still has to be able to
  # OBTAIN the block. Three creative blocks, one rule.
  - name: creative_generator_block
    class: crafting_table
    pattern:
      - [oak_planks, oak_planks, ~]
      - [~, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: oak_planks, count: 2 }
    outputs:
      - { item: creative_generator, count: 1 }
    duration: 20
    min_tier: 0
    max_tier: 32767

  - name: creative_oil_generator_block
    class: crafting_table
    pattern:
      - [oak_planks, oak_planks, ~]
      - [~, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: oak_planks, count: 2 }
    outputs:
      - { item: creative_oil_generator, count: 1 }
    duration: 20
    min_tier: 0
    max_tier: 32767

  - name: creative_water_generator_block
    class: crafting_table
    pattern:
      - [oak_planks, oak_planks, ~]
      - [~, ~, ~]
      - [~, ~, ~]
    inputs:
      - { item: oak_planks, count: 2 }
    outputs:
      - { item: creative_water_generator, count: 1 }
    duration: 20
    min_tier: 0
    max_tier: 32767

  # The coolant plant, gtnh:coolant_plant_distil_water's block. It is listed here
  # rather than in its own file only because the two creative FLUID blocks above
  # set the precedent: a machine block that emits fluid is obtained by CRAFTING
  # the block (class: crafting_table, so the loader does not strip `outputs` for
  # a generator-class block), while the fluid it emits is driven by its own
  # system, not by this recipe.
  #
  # Without this recipe the block exists in machines.yaml and the recipe binds to
  # it, but the player has no way to obtain it - the same trap creative_generator
  # fell into before a388d3c1 gave it a recipe.
  # The two creative FLUID sources, declared as fluid PRODUCERS so the
  # reachability models can see them. The fluid itself is emitted by
  # CreativeFluidSystem (kCreativeFluidSources, CreativeFluidSystem.cpp:21), a
  # C++ table -- not by a recipe. That made oil and water invisible to
  # tools/reachability_audit.py and to the C++ ratchet, so both read as
  # progression roots and any recipe with `fluid_inputs: water` looked
  # impossible, even though the game genuinely produces water.
  #
  # `fluid_outputs` is parsed for every machine class (RecipeManager.cpp:988-989),
  # including generator, so this declaration is read by the runtime too. It is
  # additive documentation of a source that already exists: CreativeFluidSystem
  # still does the actual publishing, and generator-class machines are
  # managed_externally, so MachineSystem never runs this recipe. Nothing about
  # the in-game behaviour changes - what changes is that the honest model stops
  # claiming water and oil have no source.
  - name: creative_oil_source_fluid
    class: generator
    fluid_outputs:
      - { fluid: oil, amount: 100000 }
    inputs:
      - { item: oak_planks, count: 1 }
    duration: 20
    min_tier: 0
    max_tier: 32767

  - name: creative_water_source_fluid
    class: generator
    fluid_outputs:
      - { fluid: water, amount: 100000 }
    inputs:
      - { item: oak_planks, count: 1 }
    duration: 20
    min_tier: 0
    max_tier: 32767

  - name: coolant_plant_block
    class: crafting_table
    pattern:
      - [~, ~, ~]
      - [oak_planks, oak_planks, oak_planks]
      - [~, ~, ~]
    inputs:
      - { item: oak_planks, count: 2 }
    outputs:
      - { item: coolant_plant, count: 1 }
    duration: 20
    min_tier: 0
    max_tier: 32767
