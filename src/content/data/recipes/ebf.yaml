# GTNH Platform — Electric Blast Furnace recipes
# EBF consumes EU through its physical energy hatch. Heat/HU is not required.
class: ebf
recipes:

  - name: gtnh:ebf_iron_smelting
    inputs:
      - { item: iron_dust, count: 1 }
    outputs:
      - { item: iron_ingot, count: 2 }
    duration: 400
    eu: 2.0
    energy_in: ELECTRICITY
    min_tier: 0
    max_tier: 32767
    unlock_era: 2   # hidden from NEI until EXPERT era (UX filter demo)

  - name: gtnh:ebf_gold_smelting
    inputs:
      - { item: gold_dust, count: 1 }
    outputs:
      - { item: gold_ingot, count: 2 }
    duration: 400
    eu: 2.0
    energy_in: ELECTRICITY
    min_tier: 0
    max_tier: 32767
    unlock_era: 2   # hidden from NEI until EXPERT era (UX filter demo)

  - name: gtnh:ebf_steel
    inputs:
      - { item: iron_ingot, count: 1 }
      - { item: coal, count: 1 }
    outputs:
      - { item: steel_ingot, count: 1 }
    duration: 400
    eu: 2.0
    energy_in: ELECTRICITY
    min_tier: 0
    max_tier: 32767
